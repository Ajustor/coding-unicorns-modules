name: Build & Release

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            lib_prefix: lib
            lib_ext: so
          - os: windows-latest
            platform: windows
            lib_prefix: ""
            lib_ext: dll
          - os: macos-latest
            platform: macos
            lib_prefix: lib
            lib_ext: dylib

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build all modules (release)
        run: cargo build --release --workspace

      - name: Detect modules from workspace
        id: modules
        shell: bash
        run: |
          modules=$(sed -n '/members/,/]/p' Cargo.toml | grep -o '"[^"]*"' | tr -d '"' | tr '\n' ' ')
          echo "list=${modules}" >> "$GITHUB_OUTPUT"
          echo "Detected modules: ${modules}"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          for crate in ${{ steps.modules.outputs.list }}; do
            mkdir -p "dist/${crate}"
            cp "${crate}/manifest.toml" "dist/${crate}/"
            lib_name="${{ matrix.lib_prefix }}${crate//-/_}.${{ matrix.lib_ext }}"
            src="target/release/${lib_name}"
            if [ -f "$src" ]; then
              cp "$src" "dist/${crate}/"
            else
              echo "Warning: $src not found"
            fi
          done
          ls -laR dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ matrix.platform }}
          path: dist/
          retention-days: 7

  # Every merge on master publishes a release and the registry, so the IDE always
  # offers the latest modules. The tag is the last stable one with its patch bumped;
  # pushing a v* tag by hand still works, to choose the version (minor, -rc, …).
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # Two merges in a row must not compute the same tag: the second waits for the
    # first one's tag to exist.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "$(git tag --points-at HEAD -l 'v*')" ]; then
            # A tag was pushed with this commit: its own run publishes it.
            echo "HEAD is already tagged, nothing to release"
            exit 0
          else
            last=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            last=${last:-v0.0.0}
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"

      - name: Download all artifacts
        if: steps.tag.outputs.tag != ''
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Detect modules from workspace
        if: steps.tag.outputs.tag != ''
        id: modules
        run: |
          modules=$(sed -n '/members/,/]/p' Cargo.toml | grep -o '"[^"]*"' | tr -d '"' | tr '\n' ' ')
          echo "list=${modules}" >> "$GITHUB_OUTPUT"

      - name: Package per module
        if: steps.tag.outputs.tag != ''
        run: |
          mkdir -p release registry-zips
          for crate in ${{ steps.modules.outputs.list }}; do
            mkdir -p "release/${crate}"
            # Copy manifest.toml from any platform (identical across all)
            for platform in linux windows macos; do
              manifest="artifacts/modules-${platform}/${crate}/manifest.toml"
              if [ -f "$manifest" ]; then
                cp "$manifest" "release/${crate}/"
                break
              fi
            done
            # Copy platform libraries
            for platform_dir in artifacts/modules-*/; do
              find "${platform_dir}${crate}" -maxdepth 1 -type f \
                \( -name "*.so" -o -name "*.dll" -o -name "*.dylib" \) \
                -exec cp {} "release/${crate}/" \; 2>/dev/null || true
            done
            # Create zip (all platforms, kept for manual installs)
            (cd release && zip -r "../${crate}.zip" "${crate}/")

            # Per-platform zips used by the IDE's registry: <crate>/manifest.toml + one library
            for pair in linux:linux-x86_64 windows:windows-x86_64 macos:macos-aarch64; do
              platform="${pair%%:*}"; key="${pair##*:}"
              src="artifacts/modules-${platform}/${crate}"
              [ -d "$src" ] || continue
              stage="stage/${key}/${crate}"
              mkdir -p "$stage"
              cp "release/${crate}/manifest.toml" "$stage/"
              find "$src" -maxdepth 1 -type f \( -name "*.so" -o -name "*.dll" -o -name "*.dylib" \) \
                -exec cp {} "$stage/" \;
              (cd "stage/${key}" && zip -r "../../registry-zips/${crate}-${key}.zip" "${crate}/")
            done
          done
          ls -la *.zip registry-zips/

      - name: Create GitHub Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            *.zip
            registry-zips/*.zip
          generate_release_notes: true

      # registry.json lists every module with the download URL and sha256 of each
      # per-platform zip; the IDE's extension picker reads it from GitHub Pages.
      - name: Build registry site
        if: steps.tag.outputs.tag != ''
        run: |
          python3 scripts/build_registry.py --zips registry-zips \
            --tag "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --out site

      - name: Upload Pages artifact
        if: steps.tag.outputs.tag != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  pages:
    name: Publish registry to GitHub Pages
    needs: release
    # Pre-release tags (v1.2.3-rc.1) don't replace the published registry.
    if: needs.release.outputs.tag != '' && !contains(needs.release.outputs.tag, '-')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
