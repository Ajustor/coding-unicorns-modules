[extension]
id = "unicorns.javascript-lang"
name = "JavaScript"
version = "0.3.0"
description = "JavaScript language support — syntax highlighting, hover docs, typescript-language-server LSP, js-debug debugger"
author = "Writing Unicorns"
repository = ""
documentation = "https://developer.mozilla.org/docs/Web/JavaScript"

[capabilities]
languages = ["js", "mjs"]
lsp_server = "typescript-language-server"
lsp_args = ["--stdio"]
# LSP languageId of extensions whose id differs from the extension.
language_ids = { mjs = "javascript" }

[dependencies]
npm = ["typescript-language-server", "typescript"]

# F5 without a launch configuration runs the current file with Node.
# Debug adapter: vscode-js-debug (DAP over TCP), downloaded into the module's
# folder on first use; it runs on Node.js. Launch configuration types:
# `pwa-node` for Node programs, `pwa-chrome` / `pwa-msedge` for browser pages
# (VS Code's `node`, `chrome` and `msedge` names are accepted too).
[debugger]
types = ["pwa-node", "node", "pwa-chrome", "chrome", "pwa-msedge", "msedge"]
command = "node"
args = ["${debuggerDir}/js-debug/src/dapDebugServer.js", "${port}", "127.0.0.1"]
transport = "tcp"
install_hint = "install Node.js and add it to PATH"
type_map = { node = "pwa-node", chrome = "pwa-chrome", msedge = "pwa-msedge" }

[debugger.default_launch]
type = "pwa-node"
program = "${file}"
console = "internalConsole"

[debugger.download]
binary = "js-debug/src/dapDebugServer.js"

[debugger.download.urls]
windows-x86_64 = "https://github.com/microsoft/vscode-js-debug/releases/download/v1.140.0/js-debug-dap-v1.140.0.tar.gz"
linux-x86_64 = "https://github.com/microsoft/vscode-js-debug/releases/download/v1.140.0/js-debug-dap-v1.140.0.tar.gz"
linux-aarch64 = "https://github.com/microsoft/vscode-js-debug/releases/download/v1.140.0/js-debug-dap-v1.140.0.tar.gz"
macos-aarch64 = "https://github.com/microsoft/vscode-js-debug/releases/download/v1.140.0/js-debug-dap-v1.140.0.tar.gz"
macos-x86_64 = "https://github.com/microsoft/vscode-js-debug/releases/download/v1.140.0/js-debug-dap-v1.140.0.tar.gz"
