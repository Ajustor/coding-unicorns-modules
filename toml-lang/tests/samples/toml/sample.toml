# Cargo manifest
[package]
name = "demo"
version = "0.1.0"
edition = "2021"
authors = ["A <a@example.org>"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[[bin]]
name = 'tool'
path = """src/main.rs"""

[profile.release]
opt-level = 3
lto = true
date = 1979-05-27T07:32:00Z
ratio = 0.5
