[package]
name = "batch-lang"
version = "0.1.0"
edition = "2021"
description = "Windows batch language support module for Writing Unicorns IDE"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
unicorns-highlight = { path = "../shared/highlight" }
tree-sitter-highlight = "0.25"
tree-sitter-batch = "0.11.1"

[dev-dependencies]
unicorns-highlight-test = { path = "../shared/highlight-test" }
