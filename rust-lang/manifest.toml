[extension]
id = "unicorns.rust-lang"
name = "Rust"
version = "0.3.0"
description = "Rust language support — syntax highlighting, hover docs, rust-analyzer LSP, lldb-dap debugger"
author = "Writing Unicorns"
repository = ""
documentation = "https://doc.rust-lang.org/book/"

[capabilities]
languages = ["rs"]
lsp_server = "rust-analyzer"
lsp_args = []
# LSP languageId of extensions whose id differs from the extension.
language_ids = { rs = "rust" }

[dependencies]

# Debug adapter (DAP over stdio): lldb-dap from LLVM. Needs a launch
# configuration giving the built program (e.g. target/debug/<name>).
[debugger]
types = ["lldb", "lldb-dap", "codelldb"]
command = ["lldb-dap", "lldb-vscode"]
install_hint = "install LLVM (it ships lldb-dap) and add it to PATH"
