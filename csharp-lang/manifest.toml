[extension]
id = "unicorns.csharp-lang"
name = "C#"
version = "0.2.0"
description = "C# language support — syntax highlighting, hover docs, csharp-ls LSP"
author = "Writing Unicorns"
repository = ""
documentation = "https://learn.microsoft.com/dotnet/csharp/"

[capabilities]
languages = ["cs", "csx"]
lsp_server = "csharp-ls"
lsp_args = []

[dependencies]
# Auto-installed on module install (requires the .NET SDK).
# Version pinned: the latest csharp-ls package is currently broken on NuGet.
dotnet = ["csharp-ls@0.16.0"]
