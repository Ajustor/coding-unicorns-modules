[package]
name = "config-lang"
version = "0.1.0"
edition = "2021"
description = "Configuration file support module (INI, .editorconfig, .gitignore, .env) for Writing Unicorns IDE"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
unicorns-highlight = { path = "../shared/highlight" }
tree-sitter-highlight = "0.25"
tree-sitter-ini = "1.4.0"

[dev-dependencies]
unicorns-highlight-test = { path = "../shared/highlight-test" }
