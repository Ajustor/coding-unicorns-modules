[package]
name = "react-lang"
version = "0.2.1"
edition = "2021"
description = "React (JSX/TSX) language support module for Writing Unicorns IDE"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"

[dev-dependencies]
unicorns-highlight-test = { path = "../shared/highlight-test" }
