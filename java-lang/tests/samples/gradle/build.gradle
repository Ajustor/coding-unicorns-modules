// Groovy DSL
plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = "1.0.${buildNumber}"

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.guava:guava:33.0.0-jre'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

application {
    mainClass = 'org.example.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    maxParallelForks = 4
}

def answer(int x) { return x * 42 }
