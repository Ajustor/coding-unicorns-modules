[extension]
id = "unicorns.java-lang"
name = "Java"
version = "0.2.0"
description = "Java language support — syntax highlighting, hover with Javadoc, Eclipse JDT LS (completion, diagnostics, navigation, refactoring, Maven and Gradle projects), downloaded on first use"
author = "Writing Unicorns"
repository = ""
documentation = "https://dev.java/learn/"

[capabilities]
languages = ["java"]
# Eclipse JDT LS, run directly by Java 21+ (`java` on the PATH), as its own
# `bin/jdtls` script does. Its files are downloaded into the module's folder
# when the first .java file is opened (Coding Unicorns 0.15.0+).
lsp_server = "java"
lsp_args = [
    "-Declipse.application=org.eclipse.jdt.ls.core.id1",
    "-Dosgi.bundles.defaultStartLevel=4",
    "-Declipse.product=org.eclipse.jdt.ls.core.product",
    "-Dosgi.checkConfiguration=true",
    "-Dosgi.sharedConfiguration.area=${serverDir}/config_${os}",
    "-Dosgi.sharedConfiguration.area.readOnly=true",
    "-Dosgi.configuration.cascaded=true",
    "-Djdk.xml.maxGeneralEntitySizeLimit=0",
    "-Djdk.xml.totalEntitySizeLimit=0",
    "-Xms1G",
    "--add-modules=ALL-SYSTEM",
    "--add-opens",
    "java.base/java.util=ALL-UNNAMED",
    "--add-opens",
    "java.base/java.lang=ALL-UNNAMED",
    "-jar",
    "${serverDir}/plugins/org.eclipse.equinox.launcher_*.jar",
    "-data",
    "${dataDir}",
]

# java-debug, the debugger, is a plugin of the server (Coding Unicorns 0.16.0+).
lsp_init_options = { bundles = ["${debuggerDir}/com.microsoft.java.debug.plugin.jar"] }

[capabilities.lsp_download]
binary = "bin/jdtls.py"
urls = { "*" = "https://download.eclipse.org/jdtls/snapshots/jdt-language-server-latest.tar.gz" }

[dependencies]

# Debugger: java-debug runs inside the language server, which starts each
# session and returns its port (`transport = "lsp"`). Before that, the main
# class of the open file (or of `mainClass` in the launch configuration), its
# classpath and the project's java executable are asked to the server.
[debugger]
types = ["java"]
command = "vscode.java.startDebugSession"
transport = "lsp"
default_launch = { request = "launch", cwd = "${workspaceFolder}", console = "internalConsole" }

[debugger.download]
binary = "com.microsoft.java.debug.plugin.jar"
urls = { "*" = "https://repo1.maven.org/maven2/com/microsoft/java/com.microsoft.java.debug.plugin/0.53.1/com.microsoft.java.debug.plugin-0.53.1.jar" }

[[debugger.lsp_resolve]]
command = "vscode.java.resolveMainClass"
args = ["${workspaceFolderUri}"]
unless = "mainClass"
pick = "filePath"
merge = ["mainClass", "projectName"]

[[debugger.lsp_resolve]]
command = "vscode.java.resolveClasspath"
args = ["${launch:mainClass}", "${launch:projectName}"]
unless = "classPaths"
set = ["modulePaths", "classPaths"]

[[debugger.lsp_resolve]]
command = "vscode.java.resolveJavaExecutable"
args = ["${launch:mainClass}", "${launch:projectName}"]
unless = "javaExec"
set = ["javaExec"]
