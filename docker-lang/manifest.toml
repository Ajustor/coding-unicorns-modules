[extension]
id = "unicorns.docker-lang"
name = "Docker"
version = "0.2.0"
description = "Docker support — Dockerfile and Compose highlighting with hover docs, docker-langserver and compose-language-service LSPs, a Docker panel to pull, run, remove and prune images, and pages to start, stop and read the logs of containers"
author = "Writing Unicorns"
repository = ""
documentation = "https://docs.docker.com/reference/"

[capabilities]
# `compose` is the language of Compose files, recognised by name below.
languages = ["dockerfile", "containerfile", "compose"]
lsp_server = "docker-langserver"
lsp_args = ["--stdio"]
language_ids = { containerfile = "dockerfile", compose = "dockercompose" }
# Files known by their name (Coding Unicorns 0.10.6+).
file_names = { "Dockerfile" = "dockerfile", "Dockerfile.*" = "dockerfile", "Containerfile" = "dockerfile", "Containerfile.*" = "dockerfile", "compose.yaml" = "compose", "compose.yml" = "compose", "compose.*.yaml" = "compose", "compose.*.yml" = "compose", "docker-compose.yaml" = "compose", "docker-compose.yml" = "compose", "docker-compose.*.yaml" = "compose", "docker-compose.*.yml" = "compose" }

# Compose files have their own server (Coding Unicorns 0.10.7+).
[capabilities.lsp_servers.compose]
command = "docker-compose-langserver"
args = ["--stdio"]

[dependencies]
npm = ["dockerfile-language-server-nodejs", "@microsoft/compose-language-service"]

# Interfaces (Coding Unicorns 0.10.7+): an activity bar entry listing the
# local images, and a page with the full table. Both need the docker CLI.
[[panels]]
id = "docker.images"
title = "Docker"
icon = "container"

[[panels]]
id = "docker.images.page"
title = "Docker images"
icon = "container"
location = "page"

[[panels]]
id = "docker.containers"
title = "Docker containers"
icon = "container"
location = "page"

[[panels]]
id = "docker.logs"
title = "Docker logs"
icon = "list"
location = "page"
